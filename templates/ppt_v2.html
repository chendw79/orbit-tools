<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI 幻灯片 — Orbit Tools</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e1a;--card:#111827;--border:#1e293b;--text:#f1f5f9;--text2:#94a3b8;--accent:#3b82f6;--green:#10b981}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#0a0e1a,#1a1040,#0a0e1a);color:var(--text);min-height:100vh}
.header{padding:15px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);background:rgba(17,24,39,0.8);backdrop-filter:blur(20px)}
.header a{color:var(--text2);text-decoration:none;font-size:14px}
.header a:hover{color:var(--text)}
.container{max-width:1000px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:16px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:#1a2332;color:var(--text);font-size:15px;outline:none;transition:.2s}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
label{font-size:13px;color:var(--text2);margin-bottom:6px;display:block}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 28px;font-size:15px;cursor:pointer;transition:.2s;font-weight:500}
.btn:hover{background:#2563eb;transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-green{background:var(--green)}
.row{display:flex;gap:12px;margin:12px 0;flex-wrap:wrap}

/* 幻灯片预览区域 */
.preview-container{display:none;margin-top:20px}
.slide-viewer{background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--border);position:relative}
.slide-nav{display:flex;align-items:center;justify-content:center;gap:16px;padding:12px;background:rgba(0,0,0,0.5);border-top:1px solid var(--border);flex-wrap:wrap}
.slide-nav button{background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px}
.slide-nav button:hover{background:var(--accent);border-color:var(--accent)}
.slide-nav span{color:var(--text2);font-size:13px}

/* 幻灯片内容 */
.slide-frame{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden}
.slide{display:none;width:100%;height:100%;position:absolute;top:0;left:0}
.slide.active{display:flex}
.cover{flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
.cover h1{font-size:2.2em;margin-bottom:12px;line-height:1.3;max-width:80%}
.cover p{font-size:1em;opacity:.8}
.cover-line{width:60px;height:4px;border-radius:2px;margin:16px auto}
.content-slide{flex-direction:column}
.slide-header{padding:16px 24px}
.slide-header h2{font-size:1.3em;color:#fff;font-weight:600}
.slide-body{flex:1;padding:24px 32px}
.slide-body ul{list-style:none;padding:0}
.slide-body li{font-size:1em;padding:8px 0;display:flex;align-items:flex-start;gap:10px;line-height:1.5}
.bullet{min-width:10px;width:10px;height:10px;border-radius:50%;margin-top:6px;flex-shrink:0}
.end-slide{flex-direction:column;align-items:center;justify-content:center;text-align:center}
.end-content h2{font-size:2.5em;margin-bottom:8px}

/* 模板选择器 */
.template-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.template-item{padding:8px;border-radius:8px;border:2px solid var(--border);cursor:pointer;text-align:center;transition:.2s;font-size:12px}
.template-item:hover{border-color:var(--accent)}
.template-item.active{border-color:var(--accent);background:rgba(59,130,246,.1)}
.tmpl-dot{width:20px;height:20px;border-radius:4px;margin:0 auto 4px}

.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;background:rgba(59,130,246,.15);color:#60a5fa;margin:3px}
.loading{text-align:center;padding:40px}
.spinner{display:inline-block;width:30px;height:30px;border:3px solid rgba(59,130,246,.2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.download-link{display:inline-block;padding:10px 20px;background:var(--green);color:#fff;border-radius:10px;text-decoration:none;font-weight:500}
</style>
</head>
<body>
<div class="header"><a href="/">← 返回</a><span style="font-weight:600">📊 AI 幻灯片 v2  ·  HTML 实时预览</span></div>
<div class="container">
  <div class="card">
    <label>🎯 PPT主题</label>
    <input id="topic" placeholder="输入一个主题，AI自动生成PPT" value="2026年AI产业趋势分析" onkeyup="if(event.key=='Enter')generate()">

    <div class="row">
      <div style="flex:1"><label>页数</label><select id="pages"><option>3</option><option selected>5</option><option>8</option><option>10</option></select></div>
    </div>

    <label style="margin-top:10px">🎨 选择模板 <span id="tmplDesc" style="color:var(--text2);font-size:12px;font-weight:normal"></span></label>
    <div class="template-grid" id="templateGrid"></div>

    <button class="btn" id="genBtn" onclick="generate()" style="margin-top:16px;width:100%">
      🚀 AI 生成PPT
    </button>
    
    <div class="loading" id="loading" style="display:none">
      <div class="spinner"></div>
      <p style="margin-top:12px;color:var(--text2)">AI 正在生成幻灯片…</p>
    </div>
  </div>

  <!-- 预览区域 -->
  <div class="preview-container" id="previewArea">
    <div class="card" style="padding:0">
      <div class="slide-viewer">
        <div class="slide-frame" id="slideFrame"></div>
        <div class="slide-nav">
          <button onclick="prevSlide()">◀ 上一页</button>
          <span id="slideCounter">1 / 1</span>
          <button onclick="nextSlide()">下一页 ▶</button>
          <button id="downloadBtn" class="btn-green" style="display:none;padding:6px 14px;font-size:13px" onclick="downloadPPTX()">⬇ 下载PPTX</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// 当前状态
let slides = [], currentSlide = 0, downloadUrl = '';

// 初始化模板选择器
const tmplColors = {
  business:'#1a56db', tech:'#00e6c8', minimal:'#334155',
  nature:'#228b22', tech_red:'#dc2626', ink:'#1c1917',
  neon:'#ff0080', gold:'#b8860b'
};
const tmplNames = {
  business:'商务蓝', tech:'科技暗', minimal:'简约白',
  nature:'自然绿', tech_red:'中国红', ink:'水墨风',
  neon:'赛博霓虹', gold:'尊贵金'
};

(function initTemplates() {
  const grid = document.getElementById('templateGrid');
  let active = 'business';
  Object.entries(tmplColors).forEach(([key, color]) => {
    const div = document.createElement('div');
    div.className = 'template-item' + (key === active ? ' active' : '');
    div.dataset.key = key;
    div.innerHTML = `<div class="tmpl-dot" style="background:${color}"></div>${tmplNames[key]}`;
    div.onclick = () => {
      document.querySelectorAll('.template-item').forEach(e => e.classList.remove('active'));
      div.classList.add('active');
      document.getElementById('tmplDesc').textContent = '';
    };
    grid.appendChild(div);
  });
  document.getElementById('tmplDesc').textContent = '商务蓝 — 正式专业';
})();

function getTemplate() {
  return document.querySelector('.template-item.active')?.dataset.key || 'business';
}

async function generate() {
  const topic = document.getElementById('topic').value.trim();
  if (!topic) { alert('请输入主题'); return; }

  document.getElementById('genBtn').disabled = true;
  document.getElementById('loading').style.display = 'block';
  document.getElementById('previewArea').style.display = 'none';

  try {
    const res = await fetch('/api/ppt/generate', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        topic, pages: parseInt(document.getElementById('pages').value), template: getTemplate()
      })
    });
    const json = await res.json();

    if (json.success) {
      slides = json.slides;
      currentSlide = 0;
      downloadUrl = json.download_url;
      renderSlides();
      document.getElementById('previewArea').style.display = 'block';
    } else {
      alert('失败: ' + json.error);
    }
  } catch(e) {
    alert('网络错误: ' + e.message);
  }

  document.getElementById('loading').style.display = 'none';
  document.getElementById('genBtn').disabled = false;
}

function renderSlides() {
  const frame = document.getElementById('slideFrame');
  frame.innerHTML = slides.map((html, i) => {
    return html.replace('class="slide', `class="slide${i===0?' active':''}`);
  }).join('');
  updateCounter();
  document.getElementById('downloadBtn').style.display = 'inline-block';
}

function showSlide(idx) {
  document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.slide')[idx]?.classList.add('active');
  currentSlide = idx;
  updateCounter();
}

function nextSlide() {
  if (currentSlide < slides.length - 1) showSlide(currentSlide + 1);
}

function prevSlide() {
  if (currentSlide > 0) showSlide(currentSlide - 1);
}

function updateCounter() {
  document.getElementById('slideCounter').textContent = `${currentSlide+1} / ${slides.length}`;
}

function downloadPPTX() {
  if (downloadUrl) window.location.href = downloadUrl;
}
</script>
</body>
</html>
