<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🖼️ 图片工具箱 — Orbit Tools</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e1a;--card:#111827;--border:#1e293b;--text:#f1f5f9;--text2:#94a3b8;--accent:#3b82f6;--green:#10b981;--red:#ef4444}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#0a0e1a,#1a1040,#0a0e1a);color:var(--text);min-height:100vh}
.header{padding:15px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);background:rgba(17,24,39,0.8)}
.header a{color:var(--text2);text-decoration:none;font-size:14px}
.container{max-width:900px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px}
.card-title{font-size:14px;font-weight:600;margin-bottom:10px}
label{font-size:12px;color:var(--text2);display:block;margin:8px 0 4px}
input[type=file]{width:100%;padding:30px;border:2px dashed var(--border);border-radius:12px;background:#1a2332;color:var(--text2);cursor:pointer;text-align:center;transition:.2s}
input[type=file]:hover{border-color:var(--accent);background:rgba(59,130,246,.05)}
select,input[type=range]{width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:#1a2332;color:var(--text);margin:4px 0}
.btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 20px;cursor:pointer;font-size:14px;transition:.2s;width:100%;margin-top:8px}
.btn:hover{background:#2563eb}
.btn:disabled{opacity:.5;cursor:not-allowed}
.result{display:none;margin-top:12px;padding:12px;background:#1a2332;border-radius:10px}
.result a{color:var(--green);text-decoration:none;font-weight:500}
.stats{display:flex;gap:12px;margin:8px 0;flex-wrap:wrap}
.stat{background:rgba(16,185,129,.1);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--green)}
.preview-img{max-width:100%;max-height:200px;border-radius:8px;margin-top:8px}
</style>
</head>
<body>
<div class="header"><a href="/">← 返回</a><span style="font-weight:600">🖼️ 图片工具箱</span></div>
<div class="container">
  <div class="grid">
    <!-- 背景移除 -->
    <div class="card">
      <div class="card-title">🎭 背景移除</div>
      <label>上传图片（支持JPG/PNG）</label>
      <input type="file" id="bgFile" accept="image/*">
      <button class="btn" onclick="removeBg()">✨ 移除背景</button>
      <div class="result" id="bgResult"></div>
    </div>
    
    <!-- 压缩 -->
    <div class="card">
      <div class="card-title">📦 图片压缩</div>
      <label>上传图片</label>
      <input type="file" id="compressFile" accept="image/*">
      <label>压缩质量: <span id="qualityVal">70</span>%</label>
      <input type="range" min="10" max="100" value="70" oninput="document.getElementById('qualityVal').textContent=this.value">
      <button class="btn" onclick="compressImg()">📉 压缩</button>
      <div class="result" id="compressResult"></div>
    </div>
    
    <!-- 格式转换 -->
    <div class="card">
      <div class="card-title">🔄 格式转换</div>
      <label>上传图片</label>
      <input type="file" id="convertFile" accept="image/*">
      <label>目标格式</label>
      <select id="targetFormat">
        <option value="PNG">PNG（无损）</option>
        <option value="JPEG">JPEG（有损）</option>
        <option value="WEBP">WebP（现代格式）</option>
      </select>
      <button class="btn" onclick="convertImg()">🔄 转换</button>
      <div class="result" id="convertResult"></div>
    </div>
    
    <!-- 使用说明 -->
    <div class="card">
      <div class="card-title">📖 使用说明</div>
      <p style="font-size:13px;color:var(--text2);line-height:1.8">
        ✅ 所有工具无需注册<br>
        ✅ 图片仅存24小时自动删除<br>
        ✅ 最大支持16MB<br>
        ✅ 不保留您的原始图片<br>
        ⚡ 完全免费，不限次数
      </p>
    </div>
  </div>
</div>

<script>
function showResult(el, html) {
  el.style.display = 'block'; el.innerHTML = html;
}

// 背景移除
async function removeBg() {
  const file = document.getElementById('bgFile').files[0];
  if (!file) { alert('请选择图片'); return; }
  const formData = new FormData(); formData.append('image', file);
  const btn = document.querySelector('#bgResult').previousElementSibling;
  btn.disabled = true; btn.textContent = '处理中…';
  try {
    const res = await fetch('/api/image/remove-bg', { method:'POST', body:formData });
    const json = await res.json();
    if (json.success) {
      showResult(document.getElementById('bgResult'), `
        <div class="stats"><span class="stat">原始: ${(json.size_before/1024).toFixed(0)}KB</span>
        <span class="stat">处理后: ${(json.size_after/1024).toFixed(0)}KB</span></div>
        <a href="${json.download_url}">⬇️ 下载PNG</a>
      `);
    } else { alert(json.error); }
  } catch(e) { alert('失败: '+e.message); }
  btn.disabled = false; btn.textContent = '✨ 移除背景';
}

// 压缩
async function compressImg() {
  const file = document.getElementById('compressFile').files[0];
  if (!file) { alert('请选择图片'); return; }
  const formData = new FormData();
  formData.append('image', file);
  formData.append('quality', document.getElementById('qualityVal').textContent);
  const btn = document.querySelector('#compressResult').previousElementSibling;
  btn.disabled = true; btn.textContent = '压缩中…';
  try {
    const res = await fetch('/api/image/compress', { method:'POST', body:formData });
    const json = await res.json();
    if (json.success) {
      showResult(document.getElementById('compressResult'), `
        <div class="stats"><span class="stat">原始: ${(json.size_before/1024).toFixed(0)}KB</span>
        <span class="stat">压缩后: ${(json.size_after/1024).toFixed(0)}KB</span>
        <span class="stat">节省: ${json.saved_percent}%</span></div>
        <a href="${json.download_url}">⬇️ 下载</a>
      `);
    } else { alert(json.error); }
  } catch(e) { alert('失败: '+e.message); }
  btn.disabled = false; btn.textContent = '📉 压缩';
}

// 格式转换
async function convertImg() {
  const file = document.getElementById('convertFile').files[0];
  if (!file) { alert('请选择图片'); return; }
  const formData = new FormData();
  formData.append('image', file);
  formData.append('format', document.getElementById('targetFormat').value);
  const btn = document.querySelector('#convertResult').previousElementSibling;
  btn.disabled = true; btn.textContent = '转换中…';
  try {
    const res = await fetch('/api/image/convert', { method:'POST', body:formData });
    const json = await res.json();
    if (json.success) {
      showResult(document.getElementById('convertResult'), `
        <p style="color:var(--green)">✅ 已转换为 ${json.format} 格式</p>
        <a href="${json.download_url}" style="margin-top:8px;display:inline-block">⬇️ 下载</a>
      `);
    } else { alert(json.error); }
  } catch(e) { alert('失败: '+e.message); }
  btn.disabled = false; btn.textContent = '🔄 转换';
}
</script>
</body>
</html>
