<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>📊 AI 幻灯片 — Orbit Tools</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e1a;--card:#111827;--border:#1e293b;--text:#f1f5f9;--text2:#94a3b8;--accent:#3b82f6;--green:#10b981}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#0a0e1a,#1a1040,#0a0e1a);color:var(--text);min-height:100vh}
.header{padding:15px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);background:rgba(17,24,39,0.8);backdrop-filter:blur(20px)}
.header a{color:var(--text2);text-decoration:none;font-size:14px}
.header a:hover{color:var(--text)}
.container{max-width:800px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:16px}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:#1a2332;color:var(--text);font-size:15px;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
textarea{min-height:100px;resize:vertical}
label{font-size:13px;color:var(--text2);margin-bottom:6px;display:block}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 24px;font-size:15px;cursor:pointer;transition:.2s;font-weight:500}
.btn:hover{background:#2563eb;transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:12px;margin:12px 0;flex-wrap:wrap}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;background:rgba(59,130,246,.15);color:#60a5fa;margin:3px}
.download-link{display:inline-block;padding:10px 20px;background:var(--green);color:#fff;border-radius:10px;text-decoration:none;margin-top:10px;font-weight:500}
.loading{text-align:center;padding:20px;color:var(--text2)}
.spinner{display:inline-block;width:24px;height:24px;border:3px solid rgba(59,130,246,.2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.result-area{margin-top:16px;padding:16px;border-radius:10px;background:#1a2332;display:none}
</style>
</head>
<body>
<div class="header"><a href="/">← 返回</a><span style="font-weight:600">📊 AI 幻灯片生成器</span></div>
<div class="container">
  <div class="card">
    <label>🎯 PPT主题</label>
    <input id="topic" placeholder="例如：2026年AI发展趋势、市场营销策略、项目汇报..." value="">

    <div class="row">
      <div style="flex:1"><label>页数</label><select id="pages"><option>3</option><option selected>5</option><option>8</option><option>10</option></select></div>
      <div style="flex:1"><label>风格</label><select id="template"><option value="business">商务蓝</option><option value="tech">科技暗</option><option value="minimal">简约白</option><option value="nature">自然绿</option></select></div>
    </div>

    <button class="btn" id="genBtn" onclick="generatePPT()">🚀 生成PPT</button>
    <div class="loading" id="loading" style="display:none"><div class="spinner"></div><p style="margin-top:8px">AI正在生成PPT…</p></div>
  </div>

  <div class="card result-area" id="resultCard">
    <h3 style="margin-bottom:10px">✅ 生成完成</h3>
    <div id="resultContent"></div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:10px">📋 模板预览</h3>
    <div class="row">
      <span class="badge">🎨 商务蓝 — 正式专业</span>
      <span class="badge">🌙 科技暗 — 炫酷时尚</span>
      <span class="badge">🤍 简约白 — 干净利落</span>
      <span class="badge">🌿 自然绿 — 清新自然</span>
    </div>
  </div>
</div>

<script>
async function generatePPT() {
  const topic = document.getElementById('topic').value.trim();
  if (!topic) { alert('请输入PPT主题'); return; }
  
  document.getElementById('genBtn').disabled = true;
  document.getElementById('loading').style.display = 'block';
  document.getElementById('resultCard').style.display = 'none';
  
  try {
    const res = await fetch('/api/ppt/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        topic: topic,
        pages: parseInt(document.getElementById('pages').value),
        template: document.getElementById('template').value,
      })
    });
    const json = await res.json();
    
    document.getElementById('loading').style.display = 'none';
    
    if (json.success) {
      document.getElementById('resultContent').innerHTML = `
        <p style="color:var(--text2);margin-bottom:10px">
          📄 文件大小: ${(json.size / 1024).toFixed(0)}KB
        </p>
        <a href="${json.download_url}" class="download-link">⬇️ 下载PPT</a>
        <p style="color:var(--text2);margin-top:8px;font-size:12px">文件将在24小时后自动删除</p>
      `;
      document.getElementById('resultCard').style.display = 'block';
    } else {
      alert('生成失败: ' + json.error);
    }
  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    alert('网络错误: ' + e.message);
  }
  
  document.getElementById('genBtn').disabled = false;
}
</script>
</body>
</html>
